
spring:
  application:
    name: law-test
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:law_test}
    username: ${POSTGRES_USER:law_test}
    password: ${POSTGRES_PASSWORD:law_test_local_password}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

law-test:
  auth:
    jwt:
      issuer: law-test-backend
      secret: ${JWT_SECRET:dev-only-change-this-32-byte-secret}
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
    login-protection:
      password-failure-limit: ${AUTH_PASSWORD_FAILURE_LIMIT:5}
      password-failure-window: ${AUTH_PASSWORD_FAILURE_WINDOW:PT15M}
      password-lock-duration: ${AUTH_PASSWORD_LOCK_DURATION:PT15M}
      account-limit: ${AUTH_LOGIN_ACCOUNT_LIMIT:20}
      ip-limit: ${AUTH_LOGIN_IP_LIMIT:100}
      rate-window: ${AUTH_LOGIN_RATE_WINDOW:PT1M}
    webauthn:
      rp-id: ${WEBAUTHN_RP_ID:localhost}
      rp-name: ${WEBAUTHN_RP_NAME:Law Test Development}
      allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
      ceremony-ttl: PT5M
    android:
      package-name: ${ANDROID_PACKAGE_NAME:cn.yanzongkeji.lawtest.android}
      certificate-sha256: ${ANDROID_CERTIFICATE_SHA256:DEV_CERTIFICATE_SHA256}
  admin-bootstrap:
    username: ${ADMIN_INITIAL_USERNAME:}
    password: ${ADMIN_INITIAL_PASSWORD:}
    display-name: ${ADMIN_INITIAL_DISPLAY_NAME:}
server:
  port: 9323
